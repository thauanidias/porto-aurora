[project]
name = "tgpm-talentos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.48,<2.1", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3",
  "alembic>=1.15,<2", "redis>=5,<7", "celery>=5.5,<6",
  "PyJWT>=2.10,<3", "argon2-cffi>=23.1", "python-multipart>=0.0.20",
  "httpx>=0.28,<1", "ldap3>=2.9,<3", "cryptography>=44",
  "reportlab>=4.3,<5", "openpyxl>=3.1,<4", "prometheus-client>=0.21,<1", "pillow>=12.3,<13", "pypdf>=6.19,<7"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15", "types-requests", "types-redis"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
