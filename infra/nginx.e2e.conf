server {
  listen 80;
  client_max_body_size 11m;
  add_header X-Content-Type-Options nosniff always;
  location /api/ { proxy_pass http://e2e-backend:8000; proxy_set_header X-Real-IP $remote_addr; }
  location /health { proxy_pass http://e2e-backend:8000; }
  location /readiness { proxy_pass http://e2e-backend:8000; }
  location / { proxy_pass http://frontend:80; }
}
