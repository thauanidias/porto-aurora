resolver 127.0.0.11 valid=10s ipv6=off;
upstream tgpm_backend {
  zone tgpm_backend 64k;
  server backend:8000 resolve;
}
upstream tgpm_frontend {
  zone tgpm_frontend 64k;
  server frontend:80 resolve;
}
map "$request_method:$uri" $tgpm_auth_key {
  default "";
  ~^POST:/api/v1/auth/(login|register|request-link|confirm)$ $binary_remote_addr;
}
limit_req_zone $tgpm_auth_key zone=tgpm_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=tgpm_api:10m rate=300r/m;
server {
  listen 80 default_server;
  server_name _;
  return 404;
}

server {
  listen 80;
  server_name talentos.portoaurora.example;
  location = / { return 302 /carreiras; }
  location = /portal-config.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"area":"CANDIDATO","publicUrl":"https://talentos.portoaurora.example"}';
  }
  location ~ ^/(app|gestor|entrar-rh|entrar-gestor|cadastro-gestor)(/|$) { return 404; }
  location = /api/v1/auth/register-manager { return 404; }
  include /etc/nginx/portal-locations.conf;
}

server {
  listen 80;
  server_name rh-talentos.portoaurora.example;
  location = / { return 302 /app; }
  location = /portal-config.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"area":"RH","publicUrl":"https://talentos.portoaurora.example"}';
  }
  location ~ ^/(gestor|entrar-gestor|cadastro-gestor|entrar|cadastro|candidato)(/|$) { return 404; }
  location ~ ^/(carreiras|privacidade|termo-consentimento|convite)(/|$) { return 302 https://talentos.portoaurora.example$request_uri; }
  location = /api/v1/auth/register { return 404; }
  include /etc/nginx/portal-locations.conf;
}

server {
  listen 80;
  server_name gestores-talentos.portoaurora.example;
  location = / { return 302 /gestor; }
  location = /portal-config.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"area":"GESTOR","publicUrl":"https://talentos.portoaurora.example"}';
  }
  location ~ ^/(app|entrar-rh|entrar|cadastro|candidato)(/|$) { return 404; }
  location ~ ^/(carreiras|privacidade|termo-consentimento|convite)(/|$) { return 302 https://talentos.portoaurora.example$request_uri; }
  location = /api/v1/auth/register { return 404; }
  include /etc/nginx/portal-locations.conf;
}
