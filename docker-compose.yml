name: tgpm-talentos
x-app: &app
  build: ./backend
  env_file: ${TGPM_ENV_FILE:-.env}
  restart: unless-stopped
  volumes:
    - uploads:/data/uploads
    - ./infra/certs:/etc/tgpm/ad:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  resume-ai:
    image: ollama/ollama@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - resume_models:/root/.ollama
    mem_limit: 4g
    cpus: 6
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: [local-testing]
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - test_mail:/data
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"
  backend:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
    environment:
      TRUSTED_PROXY_HOSTS: nginx,tgpm-talentos-tablet-3000,tgpm-talentos-tablet-proxy
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readiness')"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: celery -A app.tasks.worker.celery worker --loglevel=WARNING --concurrency=2
    depends_on:
      migrate:
        condition: service_completed_successfully
  beat:
    <<: *app
    command: celery -A app.tasks.worker.celery beat --loglevel=WARNING --schedule=/tmp/celerybeat
    depends_on:
      migrate:
        condition: service_completed_successfully
  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped
  frontend:
    build: ./frontend
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
volumes:
  resume_models:
  test_mail:
  postgres_data:
  redis_data:
  uploads:
  clamav_data:
